name: "🇸🇪 Nordic — REAL money"
capital_sek: 50000
cadence: weekly
benchmark: "^OMXSPI"
fx_to_sek: true   # Convert native market prices (yfinance) -> SEK at valuation,
                  # so live/stop/NAV align with the SEK cost basis. Cash and
                  # cost basis stay SEK (broker ISK settles in SEK).

llm:
  provider: openai          # openai | anthropic
  model_id: "gpt-5.6-sol"   # locked to gpt-5.6-sol for reproducibility; override in .env
  temperature: 0.2
  max_tokens: 16000
  reasoning_effort: "high"  # low | medium | high — activates extended reasoning on gpt-5+/o-series
  n_samples: 3              # run LLM 3× in parallel and take majority-vote consensus; 1 = disabled

# Model that distils evaluated outcomes into learnings (one call per evaluation
# batch, ~monthly). Defaults to this fund's provider's heavy reasoner. Set the
# same id in every fund's config to keep one lesson-writer system-wide, so the
# GPT-vs-Claude sims differ in decision model rather than in how they're coached.
# learning_model_id: "gpt-5.6-sol"

risk:
  max_position_pct: 18      # max single-name weight
  max_positions: 10
  max_sector_pct: 35        # max NAV weight in any single GICS sector
  min_cash_pct: 5           # always keep dry powder
  max_cash_pct: 10          # ISK taxed on total balance — minimise idle cash
  min_trade_sek: 2500       # below this, fees eat returns
  max_turnover_pct: 25      # max % of NAV traded per run
  stale_after_days: 5       # block buys if price data older than N trading days
  cold_start_cash_threshold: 80   # if cash% above this, allow faster initial deployment
  cold_start_turnover_pct: 50     # turnover cap used when cold-starting (% of NAV)

fees:
  rate: 0.001               # 0.10%
  min_sek: 1.0
  max_sek: 99.0             # Nordic stocks cap

data:
  price_provider: yfinance
  lookback_days: 252        # ~1 trading year
  news_feeds:
    - "https://www.avanza.se/placera/rss/senaste-analyserna.rss"  # Swedish broker analysis
    - "https://www.di.se/rss"                                      # Dagens Industri (SE)
    - "https://mfn.se/a/all.rss"                                   # Nordic regulatory filings & press releases
    - "https://e24.no/rss.xml"                                     # E24 (NO)
  macro_feeds:
    - "https://feeds.bbci.co.uk/news/business/rss.xml"             # BBC Business
    - "https://www.cnbc.com/id/100003114/device/rss/rss.html"      # CNBC Business
    - "https://www.cnbc.com/id/100727362/device/rss/rss.html"      # CNBC World/Economy
    - "https://feeds.a.wsj.com/rss/RSSWorldNews.xml"               # WSJ World News
  sentiment:
    enabled: true
    model: "ProsusAI/finbert"
    device: "cpu"           # cpu | cuda
    trigger_threshold_negative: 0.80   # fire early run if held ticker hits this (0-1)
    trigger_threshold_positive: 0.85   # fire early run for unwatched ticker (higher bar)
    trigger_cooldown_hours: 6          # don't fire twice within this window per ticker

screener:
  top_n: 75   # candidates passed to LLM per run; held positions always included on top

web:
  host: "0.0.0.0"
  port: 8010

reporting:
  currency: SEK
  output_dir: "data/reports"

# Report-reaction experiment (`fund report-watch`, engine/report_events.py):
# logs each report that moves a stock ±5% vs the index, has the model judge the
# biggest drops (overreaction / justified / unclear), and scores every event at
# +5/+20/+28 trading days. Never trades or touches the weekly prompt.
report_watch:
  enabled: true
  move_threshold_pct: 5.0
  judge_threshold_pct: 5.0
  max_judged_per_day: 10     # largest drops first; one call each, medium reasoning
  reasoning_effort: medium

# Forward shadow comparison (engine/forward.py, docs/LEARNING.md). Each saved
# Monday run also asks the incumbent prompt and this inactive candidate for a
# decision on the same frozen inputs — two extra sample sets, no trades — and
# scores both at a later common close. It is evidence for a promotion decision,
# never a promotion. Started 2026-10-12 with the 2026-09-23 bounded-search
# candidate; it is rejected (and the run carries on) if the mandate changes.
shadow:
  candidate: config/compiled/candidates/fund/20260923_064505_341292_554ebc2ba230/guidance.json
  benchmark_currency: SEK
  benchmark_calendar: XSTO
  # A second pair per run: the same prompt with its lessons removed. Measures
  # whether the lessons injected each week actually improve decisions. Needs
  # `fund shadow-variant no_lessons` once on the Pi. Skipped on a run with no lessons.
  variants: [no_lessons]

# Prompt optimizer (`fund optimize`: bounded instruction search; MIPRO retired).
optimizer:
  # Training examples are pooled across the funds: MIPRO searches for
  # instructions that make the decision task go better, which is a question
  # every fund shares, and one fund alone accrues a single example a week.
  # Only the trainset is shared — each fund still compiles and applies its
  # own guidance artifact, and its own performance is measured alone.
  pool_configs:
    - config_buffett_claude.yaml
    - config_buffett_gpt.yaml
    - config_claude.yaml
    - config_global.yaml
