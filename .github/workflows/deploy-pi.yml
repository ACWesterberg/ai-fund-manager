name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - deploy      # push to this branch triggers a deploy

  workflow_dispatch:  # also allows manual trigger from GitHub UI

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  deploy:
    needs: test
    if: github.ref_name == 'deploy'
    name: SSH deploy to Pi
    # Pinned: on 30 Oct ubuntu-latest became 26.04, whose sudo ignores -E, and
    # every deploy failed at "Connect to Tailscale". The deploy runner should
    # change only on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # v2 ran Tailscale 1.42, which accepts an OAuth secret only with
      # TS_EXPERIMENT_OAUTH_AUTHKEY set, passed through `sudo -E`. v4 runs a
      # current Tailscale that needs no such variable.
      - name: Set up Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy to Pi via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 22
          timeout: 300s
          script: |
            EXPECTED_REVISION=${{ github.sha }} DEPLOY_BRANCH=deploy bash /home/${{ secrets.PI_SSH_USER }}/Documents/ai-fund-manager/deploy/deploy.sh

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Fund Manager deployed to Pi
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Fund Manager deploy FAILED
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
