name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - deploy      # push to this branch triggers a deploy

  workflow_dispatch:  # also allows manual trigger from GitHub UI

jobs:
  test:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  deploy:
    needs: test
    if: github.ref_name == 'deploy'
    name: SSH deploy to Pi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy to Pi via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_TAILSCALE_IP }}
          username: ${{ secrets.PI_SSH_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 22
          timeout: 300s
          script: |
            # FUND_DIR: the checkout on the host. Set it when the host is the Mac Studio
            # (/Users/<you>/...); unset keeps the Pi's path. deploy/MIGRATE-TO-MAC.md
            EXPECTED_REVISION=${{ github.sha }} DEPLOY_BRANCH=deploy bash "${{ secrets.FUND_DIR || format('/home/{0}/Documents/ai-fund-manager', secrets.PI_SSH_USER) }}/deploy/deploy.sh"

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Fund Manager deployed
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            By: ${{ github.actor }}

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Fund Manager deploy FAILED
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
